<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 218" width="720" height="218" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Times the processor reached deep idle in 3 minutes of playback"><rect width="720" height="218" rx="8" fill="#fcfcfb"/><text x="24" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Times the processor reached deep idle in 3 minutes of playback</text><text x="24" y="56" font-size="13" fill="#52514e">Music on the 3.5 mm jack, screen off, off the cable. Same track, same player, 2026-10-11.</text><line x1="250" y1="76" x2="250" y2="174" stroke="#e6e5e0" stroke-width="1"/><text x="238" y="100" font-size="14" text-anchor="end" fill="#0b0b0b">Bluetooth on, nothing linked</text><text x="258.0" y="100" font-size="14" font-weight="600" fill="#0b0b0b">0</text><text x="238" y="152" font-size="14" text-anchor="end" fill="#0b0b0b">Bluetooth off</text><path d="M250,136 h386.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-386.0 z" fill="#2a78d6"/><text x="648.0" y="152" font-size="14" font-weight="600" fill="#0b0b0b">291</text><text x="24" y="202" font-size="12" fill="#52514e">With the radio on, the kernel refused deep idle 76 times a second. Battery hours are not measured.</text></svg>
