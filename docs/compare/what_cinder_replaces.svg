<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 342" width="860" height="342" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="What Cinder replaces"><rect width="860" height="342" rx="8" fill="#fcfcfb"/><text x="24" y="34" font-size="17" font-weight="600" fill="#0b0b0b">What Cinder replaces</text><text x="24" y="56" font-size="13" fill="#52514e">Cinder is the Home app. The services that decode and process sound are Sony's own in both columns.</text><text x="300" y="78" font-size="13" fill="#52514e">Sony or Walkman One firmware</text><text x="580" y="78" font-size="13" fill="#52514e">with Cinder installed</text><text x="24" y="114" font-size="13" fill="#0b0b0b">Home app</text><text x="24" y="131" font-size="12" fill="#52514e">what you see and touch</text><rect x="300" y="90" width="260" height="52" rx="4" fill="#fcfcfb" stroke="#c9c8c2"/><text x="430" y="121" font-size="13" text-anchor="middle" fill="#0b0b0b">Sony's player app</text><rect x="580" y="90" width="260" height="52" rx="4" fill="#2a78d6" stroke="#2a78d6"/><text x="710" y="121" font-size="13" text-anchor="middle" fill="#fcfcfb">Cinder</text><text x="24" y="174" font-size="13" fill="#0b0b0b">28 Sony services</text><text x="24" y="191" font-size="12" fill="#52514e">playback, sound, Bluetooth, USB, power</text><rect x="300" y="150" width="260" height="52" rx="4" fill="#fcfcfb" stroke="#c9c8c2"/><text x="430" y="181" font-size="13" text-anchor="middle" fill="#0b0b0b">Sony's</text><rect x="580" y="150" width="260" height="52" rx="4" fill="#fcfcfb" stroke="#c9c8c2"/><text x="710" y="181" font-size="13" text-anchor="middle" fill="#0b0b0b">Sony's, unchanged</text><text x="24" y="241" font-size="13" fill="#0b0b0b">Sound library on Walkman One</text><text x="24" y="251" font-size="12" fill="#52514e"></text><rect x="300" y="210" width="260" height="52" rx="4" fill="#fcfcfb" stroke="#c9c8c2"/><text x="430" y="241" font-size="13" text-anchor="middle" fill="#0b0b0b">Walkman One's</text><rect x="580" y="210" width="260" height="52" rx="4" fill="#2a78d6" stroke="#2a78d6"/><text x="710" y="241" font-size="12" text-anchor="middle" fill="#fcfcfb">one byte changed, if you choose Clear Bass</text><text x="24" y="301" font-size="13" fill="#0b0b0b">Kernel, drivers, boot loader</text><text x="24" y="311" font-size="12" fill="#52514e"></text><rect x="300" y="270" width="260" height="52" rx="4" fill="#fcfcfb" stroke="#c9c8c2"/><text x="430" y="301" font-size="13" text-anchor="middle" fill="#0b0b0b">Sony's</text><rect x="580" y="270" width="260" height="52" rx="4" fill="#fcfcfb" stroke="#c9c8c2"/><text x="710" y="301" font-size="13" text-anchor="middle" fill="#0b0b0b">Sony's, unchanged</text></svg>
