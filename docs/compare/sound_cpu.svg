<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 218" width="720" height="218" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Processor use of Sony's sound service while a track plays"><rect width="720" height="218" rx="8" fill="#fcfcfb"/><text x="24" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Processor use of Sony's sound service while a track plays</text><text x="24" y="56" font-size="13" fill="#52514e">Per cent of one processor core. Walkman One player, 3.5 mm jack, 16-bit FLAC, 2026-10-11.</text><line x1="250" y1="76" x2="250" y2="174" stroke="#e6e5e0" stroke-width="1"/><text x="238" y="100" font-size="14" text-anchor="end" fill="#0b0b0b">Direct mode</text><path d="M250,84 h18.718446601941746 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-18.718446601941746 z" fill="#2a78d6"/><text x="280.71844660194176" y="100" font-size="14" font-weight="600" fill="#0b0b0b">0.6 %</text><text x="238" y="152" font-size="14" text-anchor="end" fill="#0b0b0b">Custom: 10-band EQ + normalizer</text><path d="M250,136 h386.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-386.0 z" fill="#2a78d6"/><text x="648.0" y="152" font-size="14" font-weight="600" fill="#0b0b0b">10.3 %</text><text x="24" y="202" font-size="12" fill="#52514e">Busiest thread of the service over 15 s. About half of the Custom figure is the 10-band equalizer.</text></svg>
