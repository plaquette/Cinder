# Cross-compile to the NW-A50 (armv7 musl). Only used with
# `--target armv7-unknown-linux-musleabihf`; host builds are unaffected.
[target.armv7-unknown-linux-musleabihf]
linker = "arm-linux-musleabihf-gcc"

# glibc armhf target — for cinder-ffi (the C-ABI render staticlib linked into the
# C++ easel shell `cinder-home`). Matches the device's glibc/libc++ world.
# Only used with `--target arm-unknown-linux-gnueabihf`.
[target.arm-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
# The triple's baseline is ARMv6 + VFPv2 with no NEON and a software divide (readelf -A on the
# built library, 2026-10-10). The player is a Cortex-A7: NEON, VFPv4, hardware divide.
rustflags = ["-C", "target-cpu=cortex-a7"]
